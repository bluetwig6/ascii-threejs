<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>ASCII</title>

  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <canvas id="asciiTexture"></canvas>
  <canvas id="c"></canvas>
  <video id="video" src="./video.mp4" loop muted playsinline style="display: none;"></video>
  <div id="videoControls">
    <div class="videoControls-innerWrapper">
      <div id="preview">
        <p>PLAYING DEFAULT FILE</p>
      </div>
      <label for="fileInput" id="fileInputLabel">
        USE ANOTHER VIDEO
      </label>
      <div>
        <button id="pause-button">PAUSE</button>
      </div>
      <button id="hide-video-controls">HIDE CONTROLS</button>
    </div>
    <input type="file" multiple="false" id="fileInput">
  </div>
  <button id="show-video-controls" class="hide">SHOW FILE CONTROLS</button>
  <script type="module" src="/main.js"></script>
</body>

</html>
